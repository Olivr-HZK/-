services:
  trend-radar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
    container_name: trend-radar
    restart: unless-stopped

    ports:
      - "127.0.0.1:${WEBSERVER_PORT:-8080}:${WEBSERVER_PORT:-8080}"
    extra_hosts:   # 必须加上这个，否则连不上 Mac 代理
      - "host.docker.internal:host-gateway"
      


    volumes:
      - ../config:/app/config:ro
      - ../output:/app/output
      - ../GTscraper.py:/app/GTscraper.py
      - ../GTSummaryAI.py:/app/GTSummaryAI.py
      - ../sender:/app/sender
      - ../Imagesearch.py:/app/Imagesearch.py

    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # 运行模式
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/5 * * * *}
      - RUN_MODE=${RUN_MODE:-cron}
      - IMMEDIATE_RUN=${IMMEDIATE_RUN:-true}
